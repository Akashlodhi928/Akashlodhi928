
name: Generate Contribution Snake

# ==================================================
# TRIGGERS
# ==================================================
# Runs automatically every day at 00:00 UTC, on every
# push to the default branch, and supports manual
# execution from the Actions tab.
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

# ==================================================
# PERMISSIONS
# ==================================================
# Least privilege: the job only needs to read repo
# contents to check out the code and write contents
# to push the generated SVGs to the output branch.
permissions:
  contents: write
  actions: read

# Avoid overlapping runs stepping on each other's commits.
concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-snake:
    name: Build and publish contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ==================================================
      # STEP 1 - Checkout repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      # ==================================================
      # STEP 2 - Generate contribution snake (dark + light)
      # ==================================================
      # Platane/snk pulls the contribution graph for
      # Akashlodhi928 and renders it as an animated,
      # rounded snake with a custom pink/purple/blue
      # palette for both light and dark themes. Both
      # SVGs use a transparent background so they sit
      # cleanly inside README.md in either GitHub theme.
      - name: Generate contribution snake animation
        id: generate-snake
        uses: Platane/snk@v3
        with:
          github_user_name: Akashlodhi928
          outputs: |
            output/github-contribution-grid-snake.svg?color_snake=%23ff4fd8&color_dots=%23ebedf0,%23f4c6ee,%23e3a8fa,%23c084fc,%239b5cff&color_background=%23000000ff
            output/github-contribution-grid-snake-dark.svg?color_snake=%23ff4fd8&color_dots=%23161b22,%233a1f52,%235b2f8a,%237c3aed,%23a855f7&color_background=%23000000ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # STEP 3 - Verify generated output
      # ==================================================
      # Fail fast with a clear message if the action did
      # not produce the expected files, rather than
      # silently publishing an empty/broken output branch.
      - name: Verify generated SVG files exist
        run: |
          set -euo pipefail
          for file in \
            "output/github-contribution-grid-snake.svg" \
            "output/github-contribution-grid-snake-dark.svg"; do
            if [ ! -s "$file" ]; then
              echo "::error::Expected generated file '$file' is missing or empty."
              exit 1
            fi
          done
          echo "Both light and dark snake SVGs were generated successfully."

      # ==================================================
      # STEP 4 - Publish to the output branch
      # ==================================================
      # Publishes only the contents of ./output to the
      # dedicated 'output' branch, overwriting previous
      # files (force_orphan keeps that branch history
      # lean and free of merge noise). A commit is only
      # created when the generated SVGs actually differ,
      # so unchanged days do not produce empty commits.
      - name: Deploy generated snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./output
          publish_speed: 100
          force_orphan: true
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: update contribution snake animation"

      # ==================================================
      # STEP 5 - Workflow summary
      # ==================================================
      # Clear, human-readable log output for quick
      # diagnostics from the Actions run summary page.
      - name: Print workflow summary
        if: always()
        run: |
          {
            echo "### Contribution Snake Generation"
            echo ""
            echo "- Light theme: output/github-contribution-grid-snake.svg"
            echo "- Dark theme:  output/github-contribution-grid-snake-dark.svg"
            echo "- Published branch: output"
            echo "- Triggered by: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
