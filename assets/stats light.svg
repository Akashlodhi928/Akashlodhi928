<svg width="470" height="300" viewBox="0 0 470 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Verdana,Helvetica,Arial,sans-serif"><defs><linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fdf2ff"/><stop offset="100%" stop-color="#fce7ff"/>
    </linearGradient><linearGradient id="barRepos" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e879f9"/><stop offset="100%" stop-color="#c026d3"/>
    </linearGradient><linearGradient id="barStars" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffe08a"/><stop offset="100%" stop-color="#ffb020"/>
    </linearGradient><linearGradient id="barFollowers" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient><linearGradient id="barFollowing" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#86efac"/><stop offset="100%" stop-color="#22c55e"/>
    </linearGradient><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d6249f"/><stop offset="100%" stop-color="#8b3fd1"/>
    </linearGradient><filter id="statGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><clipPath id="statsClip"><rect x="0" y="0" width="470" height="300" rx="18"/></clipPath></defs>

<g clip-path="url(#statsClip)">
<rect x="0" y="0" width="470" height="300" fill="url(#statsBg)" stroke="#e3c6f5" stroke-width="1"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#4a1361">GitHub Stats — Akashlodhi928</text>
<line x1="24" y1="44" x2="446" y2="44" stroke="#e3c6f5" stroke-width="1"/>

<!-- Avatar ring -->
<g transform="translate(400,90)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
  <circle r="34" fill="none" stroke="#eeddfa" stroke-width="7"/>
  <circle r="34" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round"
    stroke-dasharray="213.5 213.5" transform="rotate(-90)" filter="url(#statGlow)">
    <animate attributeName="stroke-dasharray" from="0 213.5" to="213.5 213.5" begin="0.5s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </circle>
  <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="800" fill="#4a1361">AL</text>
</g>

<!-- Bars -->
<!-- Repositories: 7 -->
<g transform="translate(90,260)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
  <rect x="-35" y="0" width="70" height="0" rx="14" fill="url(#barRepos)" filter="url(#statGlow)">
    <animate attributeName="y" from="0" to="-105" begin="0.5s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="height" from="0" to="105" begin="0.5s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="0" y="-118" text-anchor="middle" font-size="20" font-weight="800" fill="#c026d3" opacity="0">7
    <animate attributeName="opacity" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="0" y="20" text-anchor="middle" font-size="12" fill="#7a3fa0">Repositories</text>
</g>

<!-- Stars: 13 -->
<g transform="translate(210,260)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
  <rect x="-35" y="0" width="70" height="0" rx="14" fill="url(#barStars)" filter="url(#statGlow)">
    <animate attributeName="y" from="0" to="-195" begin="0.6s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="height" from="0" to="195" begin="0.6s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="0" y="-208" text-anchor="middle" font-size="20" font-weight="800" fill="#ffb020" opacity="0">13
    <animate attributeName="opacity" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="0" y="20" text-anchor="middle" font-size="12" fill="#7a3fa0">Stars</text>
</g>

<!-- Followers: 6 -->
<g transform="translate(330,260)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
  <rect x="-35" y="0" width="70" height="0" rx="14" fill="url(#barFollowers)" filter="url(#statGlow)">
    <animate attributeName="y" from="0" to="-90" begin="0.7s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="height" from="0" to="90" begin="0.7s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="0" y="-103" text-anchor="middle" font-size="20" font-weight="800" fill="#0ea5e9" opacity="0">6
    <animate attributeName="opacity" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="0" y="20" text-anchor="middle" font-size="12" fill="#7a3fa0">Followers</text>
</g>

<!-- Following: 7 -->
<g transform="translate(410,260)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
  <rect x="-35" y="0" width="70" height="0" rx="14" fill="url(#barFollowing)" filter="url(#statGlow)">
    <animate attributeName="y" from="0" to="-105" begin="0.8s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="height" from="0" to="105" begin="0.8s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="0" y="-118" text-anchor="middle" font-size="20" font-weight="800" fill="#22c55e" opacity="0">7
    <animate attributeName="opacity" to="1" begin="1.8s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="0" y="20" text-anchor="middle" font-size="12" fill="#7a3fa0">Following</text>
</g>

<line x1="24" y1="260" x2="446" y2="260" stroke="#e3c6f5" stroke-width="1"/>

</g>
</svg>
