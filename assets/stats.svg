<svg width="470" height="300" viewBox="0 0 470 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Verdana,Helvetica,Arial,sans-serif"><defs><linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/><stop offset="100%" stop-color="#2d0f4e"/>
</linearGradient><linearGradient id="barRepos" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ff4fd8"/><stop offset="100%" stop-color="#a855f7"/>
</linearGradient><linearGradient id="barStars" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff9f1c"/>
</linearGradient><linearGradient id="barFollowers" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/>
</linearGradient><linearGradient id="barFollowing" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#7dffb3"/><stop offset="100%" stop-color="#22c55e"/>
</linearGradient><filter id="statGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter><clipPath id="statsClip"><rect x="0" y="0" width="470" height="300" rx="18"/></clipPath></defs>

<g clip-path="url(#statsClip)">
<rect x="0" y="0" width="470" height="300" fill="url(#statsBg)" stroke="#5b2a86" stroke-width="1"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#f5d0ff">📊 GitHub Stats — Akashlodhi928</text>
<line x1="24" y1="46" x2="446" y2="46" stroke="#5b2a86" stroke-width="1"/>

<!-- avatar circle badge -->
<circle cx="410" cy="80" r="30" fill="none" stroke="url(#barRepos)" stroke-width="3" filter="url(#statGlow)">
  <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
</circle>
<text x="410" y="86" text-anchor="middle" font-size="20" font-weight="800" fill="#f5d0ff">AL</text>

<!-- Bar chart: 4 categories -->
<!-- baseline -->
<line x1="55" y1="250" x2="446" y2="250" stroke="#5b2a86" stroke-width="1.5"/>

<!-- Repositories bar -->
<g transform="translate(75,0)">
  <rect x="0" y="250" width="60" height="0" rx="8" fill="url(#barRepos)" filter="url(#statGlow)">
    <animate attributeName="height" from="0" to="80" begin="0.3s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="y" from="250" to="170" begin="0.3s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="30" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#ff4fd8" opacity="0">
    7<animate attributeName="opacity" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="30" y="270" text-anchor="middle" font-size="12" fill="#c9a6ff">Repositories</text>
</g>

<!-- Stars bar -->
<g transform="translate(175,0)">
  <rect x="0" y="250" width="60" height="0" rx="8" fill="url(#barStars)" filter="url(#statGlow)">
    <animate attributeName="height" from="0" to="140" begin="0.45s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="y" from="250" to="110" begin="0.45s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="30" y="100" text-anchor="middle" font-size="20" font-weight="800" fill="#ffd166" opacity="0">
    13<animate attributeName="opacity" to="1" begin="1.25s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="30" y="270" text-anchor="middle" font-size="12" fill="#c9a6ff">Stars</text>
</g>

<!-- Followers bar -->
<g transform="translate(275,0)">
  <rect x="0" y="250" width="60" height="0" rx="8" fill="url(#barFollowers)" filter="url(#statGlow)">
    <animate attributeName="height" from="0" to="70" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="y" from="250" to="180" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="30" y="170" text-anchor="middle" font-size="20" font-weight="800" fill="#22d3ee" opacity="0">
    6<animate attributeName="opacity" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="30" y="270" text-anchor="middle" font-size="12" fill="#c9a6ff">Followers</text>
</g>

<!-- Following bar -->
<g transform="translate(375,0)">
  <rect x="0" y="250" width="60" height="0" rx="8" fill="url(#barFollowing)" filter="url(#statGlow)">
    <animate attributeName="height" from="0" to="80" begin="0.75s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    <animate attributeName="y" from="250" to="170" begin="0.75s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </rect>
  <text x="30" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#7dffb3" opacity="0">
    7<animate attributeName="opacity" to="1" begin="1.55s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="30" y="270" text-anchor="middle" font-size="12" fill="#c9a6ff">Following</text>
</g>

</g>
</svg>
